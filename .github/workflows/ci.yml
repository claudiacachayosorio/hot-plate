name: CI
run-name: >
  CI for ${{ github.head_ref || github.ref_name }} (${{ github.event_name }})

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: >-
            test/bats
            test/test_helper

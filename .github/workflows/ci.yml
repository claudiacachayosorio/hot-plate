name: CI
run-name: CI Pipeline for ${{ github.head_ref }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: >-
            test/bats
            test/test_helper

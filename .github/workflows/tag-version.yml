name: Main - Auto Tag Version
run-name: Version tag for commit ${{ github.event.head_commit.id }}

on:
  push:
    branches: [main]

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update version
        env:
          SCRIPT: "./.github/scripts/tag-version.sh"
          COMMIT: ${{ github.event.head_commit.message }}
        run: |
          chmod +x "$SCRIPT"
          "$SCRIPT" "$COMMIT"

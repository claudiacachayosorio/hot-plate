name: PR - Validate Title
run-name: >-
  "Validate title for PR #${{ github.event.pull_request.number }} |
  ${{ github.head_ref }} (${{ github.event.action }})"

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Run semantic-pull-request
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

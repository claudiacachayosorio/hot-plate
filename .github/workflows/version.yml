name: Version
run-name: >-
  Bump: ${{ github.event.head_commit.message || inputs.commit }}
  (${{ github.event_name }} on ${{ github.ref_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit message for PR squash merge"
        required: true

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x ./.github/scripts/version.sh
          ./.github/scripts/version.sh

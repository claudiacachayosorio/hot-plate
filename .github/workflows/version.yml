name: Version
run-name: Version bump for "${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update version
        env:
          SCRIPT: "./.github/scripts/version.sh"
        run: |
          chmod +x "$SCRIPT"
          "$SCRIPT" "${{ github.event.head_commit.message }}"

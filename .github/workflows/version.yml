name: Version

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine semantic version
        id: semver
        uses: paulhatch/semantic-version@v6
        with:
          tag_prefix: "v"
          major_pattern: "!:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      - name: Create Git tag
        if: steps.semver.outputs.is_tagged == "false"
        env:
          TAG: ${{ steps.semver.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

name: Version

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version change
        id: semver
        uses: paulhatch/semantic-version@v6
        with:
          tag_prefix: "v"
          major_pattern: "!:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      - name: Update & push version
        if: steps.semver.outputs.is_tagged == "false"
        env:
          VER: ${{ steps.semver.outputs.version }}
          TAG: ${{ steps.semver.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf "%s" "$VER" > VERSION
          git add VERSION

          if ! git diff --quiet --cached; then
            git commit -m "chore(release): bump ${TAG} [skip ci]"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin HEAD:main --follow-tags
          fi

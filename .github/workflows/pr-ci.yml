name: PR - CI Pipeline
run-name: >-
  "CI for PR #${{ github.event.pull_request.number }} |
  ${{ github.head_ref }} (${{ github.event.action }})"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: >-
            test/bats
            test/test_helper
